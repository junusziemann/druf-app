<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRuf</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #181c26;
    --border: #232838;
    --text: #e6e9f2;
    --muted: #8a92a6;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --danger: #ff5c7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    width: min(420px, 90vw);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 40px 34px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 26px; color: #fff;
    box-shadow: 0 10px 30px rgba(124,92,255,.45);
  }
  h1 { font-size: 28px; letter-spacing: .5px; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .field { margin-top: 26px; text-align: left; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  input[type=text], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }
  input[type=text]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124,92,255,.2);
  }
  .btn {
    margin-top: 16px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    cursor: pointer;
    transition: transform .1s, filter .2s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---------- App ---------- */
  #app {
    height: 100%;
    display: grid;
    grid-template-columns: 240px 1fr;
  }
  aside {
    background: rgba(18,21,29,.7);
    backdrop-filter: blur(10px);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; padding: 0 8px; }
  .brand .logo { width: 40px; height: 40px; font-size: 18px; margin: 0; border-radius: 12px; }
  .brand strong { font-size: 18px; }
  .nav-btn {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .nav-btn:hover { color: var(--text); background: var(--panel-2); }
  .nav-btn.active {
    color: var(--text);
    background: linear-gradient(135deg, rgba(124,92,255,.25), rgba(34,211,238,.1));
    border-color: rgba(124,92,255,.45);
  }
  .nav-btn small { display: block; font-size: 11px; opacity: .7; margin-top: 2px; }
  .aside-foot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 0 8px; }

  main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  header {
    padding: 22px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  header h2 { font-size: 18px; }
  header p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .clear {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .clear:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 480px;
  }
  .empty h3 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent-2); }

  .msg {
    max-width: 82%;
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade .25s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot pre {
    background: #07090e;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0;
    overflow-x: auto;
    font-family: Consolas, monospace;
    font-size: 12.5px;
    white-space: pre;
  }
  .msg.bot code {
    font-family: Consolas, monospace;
    background: #07090e;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 12.5px;
  }
  .msg.bot pre code { background: none; padding: 0; }
  .msg.error { color: var(--danger); border-color: rgba(255,92,122,.4); }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px;
    border-radius: 50%; background: var(--accent-2); opacity: .3;
    animation: blink 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  .composer {
    padding: 18px 30px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .composer textarea {
    resize: none;
    height: 56px;
    max-height: 200px;
  }
  .send {
    width: 110px;
    height: 56px;
    margin: 0;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="logo">D</div>
    <h1>DRuf</h1>
    <p class="sub">Dein KI-Assistent für FiveM</p>
    <div class="field">
      <label for="code">Zugangscode</label>
      <input type="text" id="code" placeholder="FIVEM-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="loginBtn">Anmelden</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside>
    <div class="brand">
      <div class="logo">D</div>
      <strong>DRuf</strong>
    </div>
    <button class="nav-btn active" data-mode="scripts">Scripts<small>Lua, ESX, QBCore, ox_lib</small></button>
    <button class="nav-btn" data-mode="bewerbungen">Bewerbungen<small>Texte & Tipps für Teams</small></button>
    <button class="nav-btn" data-mode="fragen">Fragen<small>Setup, Fehler, Konfiguration</small></button>
    <div class="aside-foot">Unbegrenzte Nutzung</div>
  </aside>

  <main>
    <header>
      <div>
        <h2 id="modeTitle">Scripts</h2>
        <p id="modeDesc">Schreibe, erkläre oder repariere FiveM-Scripts.</p>
      </div>
      <button class="clear" id="clearBtn">Chat leeren</button>
    </header>

    <div id="chat"></div>

    <div class="composer">
      <textarea id="input" placeholder="Nachricht eingeben… (Enter senden, Shift+Enter neue Zeile)"></textarea>
      <button class="btn send" id="sendBtn">Senden</button>
    </div>
  </main>
</div>

<script>
  const MODES = {
    scripts: {
      title: "Scripts",
      desc: "Schreibe, erkläre oder repariere FiveM-Scripts.",
      empty: "Beschreibe, welches Script du brauchst – ich liefere lauffähigen Code.",
      chips: ["Ein /carry-Script für ESX", "Fehler in fxmanifest.lua finden", "Ein Notify-Script mit ox_lib"]
    },
    bewerbungen: {
      title: "Bewerbungen",
      desc: "Texte und Tipps für Bewerbungen bei FiveM-Teams.",
      empty: "Erzähl mir kurz, für welches Team du dich bewirbst – ich helfe beim Text.",
      chips: ["Staff-Bewerbung schreiben", "Fraktions-Bewerbung verbessern", "Tipps für ein Bewerbungsgespräch"]
    },
    fragen: {
      title: "Fragen",
      desc: "Setup, Konfiguration und Fehlermeldungen rund um FiveM.",
      empty: "Stell deine Frage – ich helfe bei Setup, txAdmin, Resources und Fehlern.",
      chips: ["Was bedeutet 'resource not found'?", "Wie richte ich txAdmin ein?", "ESX oder QBCore?"]
    }
  };

  let mode = "scripts";
  let history = { scripts: [], bewerbungen: [], fragen: [] };
  let busy = false;

  const $ = (id) => document.getElementById(id);

  // ---------- Login ----------
  async function login() {
    const code = $("code").value;
    $("loginError").textContent = "";
    if (!code.trim()) { $("loginError").textContent = "Bitte Code eingeben."; return; }
    $("loginBtn").disabled = true;
    try {
      const res = await window.api.check_code(code);
      if (res.ok) {
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        renderMode();
        $("input").focus();
      } else {
        $("loginError").textContent = "Ungültiger Code.";
      }
    } catch (e) {
      $("loginError").textContent = "Fehler beim Prüfen des Codes.";
    }
    $("loginBtn").disabled = false;
  }
  $("loginBtn").addEventListener("click", login);
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  // ---------- Modes ----------
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      mode = btn.dataset.mode;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b === btn));
      renderMode();
    });
  });

  function renderMode() {
    const m = MODES[mode];
    $("modeTitle").textContent = m.title;
    $("modeDesc").textContent = m.desc;
    renderChat();
  }

  function renderChat() {
    const chat = $("chat");
    chat.innerHTML = "";
    const msgs = history[mode];
    if (msgs.length === 0) {
      const m = MODES[mode];
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = `<h3>${m.title}</h3><p>${m.empty}</p><div class="chips"></div>`;
      const chips = empty.querySelector(".chips");
      m.chips.forEach(text => {
        const c = document.createElement("button");
        c.className = "chip";
        c.textContent = text;
        c.addEventListener("click", () => { $("input").value = text; send(); });
        chips.appendChild(c);
      });
      chat.appendChild(empty);
      return;
    }
    msgs.forEach(m => chat.appendChild(bubble(m.role, m.content, m.error)));
    scrollDown();
  }

  // ---------- Markdown (minimal, sicher) ----------
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function formatBot(text) {
    const parts = text.split(/```/);
    return parts.map((part, i) => {
      if (i % 2 === 1) {
        const body = part.replace(/^[a-zA-Z0-9_+-]*\n/, "");
        return `<pre><code>${escapeHtml(body)}</code></pre>`;
      }
      return escapeHtml(part).replace(/`([^`\n]+)`/g, "<code>$1</code>")
                             .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }).join("");
  }

  function bubble(role, content, isError) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot") + (isError ? " error" : "");
    if (role === "user" || isError) {
      div.textContent = content;
    } else {
      div.innerHTML = formatBot(content);
    }
    return div;
  }

  function scrollDown() {
    const chat = $("chat");
    chat.scrollTop = chat.scrollHeight;
  }

  // ---------- Senden ----------
  async function send() {
    if (busy) return;
    const text = $("input").value.trim();
    if (!text) return;
    $("input").value = "";

    const current = mode;
    history[current].push({ role: "user", content: text });
    busy = true;
    $("sendBtn").disabled = true;
    renderChat();

    const typing = document.createElement("div");
    typing.className = "msg bot typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    $("chat").appendChild(typing);
    scrollDown();

    try {
      const res = await window.api.ask(current, history[current]);
      typing.remove();
      if (res.error) {
        history[current].push({ role: "assistant", content: res.error, error: true });
      } else {
        history[current].push({ role: "assistant", content: res.text });
      }
    } catch (e) {
      typing.remove();
      history[current].push({ role: "assistant", content: "Unerwarteter Fehler: " + e, error: true });
    }
    busy = false;
    $("sendBtn").disabled = false;
    if (mode === current) renderChat();
    $("input").focus();
  }

  $("sendBtn").addEventListener("click", send);
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  $("clearBtn").addEventListener("click", () => {
    history[mode] = [];
    renderChat();
  });
</script>
</body>
</html>
