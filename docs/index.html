<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRuf – Zugang</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --border:#232838; --text:#e6e9f2; --muted:#8a92a6; --accent:#7c5cff; --accent2:#22d3ee; --danger:#ff5c7a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); min-height: 100vh;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(34,211,238,.12), transparent 60%), var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: min(460px, 100%); background: linear-gradient(180deg, #181c26, var(--panel));
    border: 1px solid var(--border); border-radius: 22px; padding: 40px 34px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); text-align: center;
  }
  .logo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 800; font-size: 26px; color: #fff; }
  h1 { font-size: 28px; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; line-height: 1.5; }
  label { display: block; text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 26px; }
  input {
    width: 100%; margin-top: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 14px 16px; font-size: 15px; outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,92,255,.2); }
  .btn {
    display: block; margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 600; color: #fff; text-decoration: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #5b8cff);
  }
  .btn:hover { filter: brightness(1.08); }
  .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>DRuf</h1>
  <p class="sub">Dein FiveM-Assistent. Gib deinen Zugangscode ein, um die App herunterzuladen.</p>

  <div id="loginView">
    <label for="code">Zugangscode</label>
    <input type="text" id="code" placeholder="FIVEM-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    <button class="btn" id="checkBtn">Prüfen</button>
    <div class="error" id="error"></div>
  </div>

  <div id="downloadView" class="hidden">
    <p class="sub" style="margin-top:22px">Zugang bestätigt.</p>
    <!-- Hier den Link zu deiner DRuf.exe (oder zum ZIP) eintragen -->
    <a class="btn" id="downloadBtn" href="DOWNLOAD_LINK_HIER_EINTRAGEN">DRuf herunterladen</a>
    <p class="hint">Nach dem Download einfach DRuf.exe starten. Der Zugang gilt nur für diesen Browser-Tab.</p>
  </div>
</div>

<script>
  // SHA-256-Hashes der gültigen Zugangscodes (Klartext steht nicht auf der Seite)
  const VALID = new Set([
    "89172081e3c49e0e4c432b0371f426cefd982004005282dd6f64956a4653134b",
    "2888a55a6c471aaf44851e3ff3753422448324a5f8d2ca6b69c830c7c6f116dd",
    "257f876dd801f7735cb845ea619c632af521ed691b19ce54e9d6b2e6d37e1bdd",
    "c1c795ec1d533a135d9f45a1534ccc423b369884b2b6d5efa97a9159ff751396",
    "df6bca3325cdd696045967492ffaf52b1d804ceacdfd2bfaaaac83b1559674f4",
    "103e2b6ca228a89a5d553f1b1909dc537b025a5dc14f61abb2eba9c143de12f9",
    "ab938f430d3d2bb581becb59a4478fe20224fd96585601c119abbde7fbc81c74",
    "06ab7f2b2137f266401e0d0aff1faa71e0b778417788a3e8695ec47270ff4ea0",
    "82a69e7ab6d78ed8086a12bcf4dc43a7898dd6d63db16599444e8e2372ad1580",
    "578f5592536a8beb7d833ff7222dcec7ee7f8cb32a105e2f8d2bf0cd3f40700c"
  ]);

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function showDownload() {
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("downloadView").classList.remove("hidden");
  }

  async function check() {
    const err = document.getElementById("error");
    err.textContent = "";
    const code = document.getElementById("code").value.trim().toUpperCase();
    if (!code) { err.textContent = "Bitte Code eingeben."; return; }
    const hash = await sha256(code);
    if (VALID.has(hash)) {
      sessionStorage.setItem("druf_ok", "1");
      showDownload();
    } else {
      err.textContent = "Ungültiger Code.";
    }
  }

  document.getElementById("checkBtn").addEventListener("click", check);
  document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  if (sessionStorage.getItem("druf_ok") === "1") showDownload();
</script>
</body>
</html>
